{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}VASTRAM{% endblock %}</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* =========================
           BODY
        ========================= */

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: #ffffff;
            color: #222;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            background-color: #ffffff;
            padding: 15px clamp(16px, 5vw, 72px);
            border-bottom: 1px solid #e8e2df;
            position: sticky;
            top: 0;
            z-index: 9999;
        }


        .navbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            position: relative;
            max-width: 1440px;
            margin: 0 auto;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            justify-self: start;
            color: #823237;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 34px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 3px;
            line-height: 1;
        }


        /* =========================
           CENTER NAVIGATION
        ========================= */

        .nav-center {
            display: flex;
            align-items: center;
            gap: clamp(20px, 3vw, 42px);
        }


        .nav-center > a,
        .dropdown-btn {

            color: #332d2b;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .7px;
            cursor: pointer;
        }


        .nav-center > a:hover,
        .dropdown-btn:hover {

            color: #9b3438;
        }


        /* =========================
           CATEGORY DROPDOWN
        ========================= */

        .dropdown {
            position: relative;
        }


        .dropdown-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0;
            border: 0;
            background: none;
            font-family: inherit;
        }


        .dropdown-btn i {

            font-size: 9px;
        }


        .dropdown-content {
            display: none;
            position: absolute;
            top: calc(100% + 16px);
            left: 50%;
            transform: translateX(-50%);
            min-width: 200px;
            background: #fff;
            box-shadow: 0 14px 34px rgba(40, 28, 25, .14);
            z-index: 99999;
            padding: 9px 0;
            border: 1px solid #eee9e6;
        }


        .dropdown-content a {

            display: block;

            color: #332d2b;
            padding: 11px 18px;
            text-decoration: none;
            font-size: 12px;
        }


        .dropdown-content a:hover {

            background-color: #f8f5f2;
            color: #9b3438;
        }


        /* Show dropdown when mouse is over Categories */

        .dropdown:hover .dropdown-content {

            display: block;
        }


        .dropdown.open .dropdown-content {
            display: block;
        }

        /* =========================
           RIGHT SIDE ICONS
        ========================= */

        .nav-icons {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: clamp(14px, 1.8vw, 24px);
            margin-left: auto;
        }


        .nav-icon {

            color: #332d2b;
            text-decoration: none;
            font-size: 18px;
            transition: color .2s;
            position: relative;
        }


        .nav-count {
            position: absolute;
            top: -9px;
            right: -11px;
            display: grid;
            place-items: center;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 10px;
            background: #9b3438;
            color: #fff;
            font-size: 10px;
            line-height: 1;
        }

        .nav-count[hidden] {
            display: none;
        }


        .nav-icon:hover {

            color: #9b3438;
        }

        .nav-orders-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .nav-login-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 12px;
            background: #823237;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }

        .nav-login-link:hover {
            background: #66262a;
            color: #fff;
        }

        .nav-login-link i { font-size: 13px; }

        .mobile-menu-toggle {
            display: none;
            width: 38px;
            height: 38px;
            border: 1px solid #e8e2df;
            background: #fff;
            color: #332d2b;
            font-size: 15px;
            cursor: pointer;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-container {

            position: relative;
        }


        .search-button {

            border: none;

            background: none;

            padding: 0;

            cursor: pointer;
            font-family: inherit;
        }


        .header-search-form {

            display: none;

            position: absolute;

            top: calc(100% + 15px);
            right: 0;
            background: #fff;
            padding: 8px;
            box-shadow: 0 14px 34px rgba(40, 28, 25, .14);
            z-index: 100000;
            white-space: nowrap;
            border: 1px solid #eee9e6;
        }


        .header-search-form input {

            width: 200px;

            padding: 9px 10px;

            border: 1px solid #ddd;

            outline: none;

            font-size: 13px;
        }


        .header-search-form button {

            border: none;

            background: #222;

            color: white;

            padding: 10px 12px;

            cursor: pointer;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {

            min-height: 70vh;

            padding: 0;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            background-color: #222;

            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 50px;
        }

        @media (max-width: 900px) {
            .navbar {
                grid-template-columns: auto 1fr auto;
                column-gap: 14px;
            }

            .logo { font-size: 30px; }
            .mobile-menu-toggle { display: inline-grid; place-items: center; }

            .nav-center {
                display: none;
                position: absolute;
                top: calc(100% + 15px);
                left: calc(-1 * clamp(16px, 5vw, 72px));
                right: calc(-1 * clamp(16px, 5vw, 72px));
                align-items: stretch;
                gap: 0;
                padding: 8px clamp(16px, 5vw, 72px) 16px;
                border-bottom: 1px solid #e8e2df;
                background: #fff;
                box-shadow: 0 16px 24px rgba(40, 28, 25, .1);
            }

            .nav-center.is-open { display: flex; flex-direction: column; }
            .nav-center > a, .dropdown-btn { padding: 14px 0; }
            .dropdown-content {
                position: static;
                transform: none;
                min-width: 0;
                padding: 0 0 6px 12px;
                border: 0;
                box-shadow: none;
            }
            .dropdown:hover .dropdown-content { display: none; }
            .dropdown.open .dropdown-content { display: block; }
        }

        @media (max-width: 480px) {
            .header { padding-top: 12px; padding-bottom: 12px; }
            .navbar { column-gap: 9px; }
            .logo { font-size: 25px; letter-spacing: 2px; }
            .mobile-menu-toggle { width: 34px; height: 34px; }
            .nav-icons { gap: 13px; }
            .nav-icon { font-size: 16px; }
            .nav-login-link { gap: 5px; padding: 7px 8px; font-size: 10px; }
            .nav-login-link i { font-size: 12px; }
            .nav-count { min-width: 16px; height: 16px; font-size: 9px; }
        }


    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <div class="navbar">


            <!-- LOGO -->

            <a href="{% url 'home' %}" class="logo">

                VASTRAM

            </a>

            <button type="button" class="mobile-menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="navCenter" data-mobile-menu-toggle>
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>



            <!-- CENTER NAVIGATION -->

            <nav class="nav-center" id="navCenter" aria-label="Main navigation">


                <!-- HOME -->

                <a href="{% url 'home' %}">

                    Home

                </a>



                <!-- CATEGORIES -->

                <div class="dropdown">

                    <button type="button" class="dropdown-btn" aria-expanded="false" data-category-toggle>

                        Categories

                        <i class="fa-solid fa-chevron-down"></i>

                    </button>


                    <div class="dropdown-content">

    <a href="{% url 'product_list' %}">
        All Collections
    </a>

    <a href="{% url 'product_list' %}?category=Saree">
        Saree
    </a>

    <a href="{% url 'product_list' %}?category=Kurtis">
        Kurtis
    </a>

    <a href="{% url 'product_list' %}?category=Anarkali">
        Anarkali
    </a>

    <a href="{% url 'product_list' %}?category=Party%20Wear">
        Party Wear
    </a>

    <a href="{% url 'product_list' %}?category=Set%20Mundu">
        Set Mundu
    </a>

</div>

                </div>

            <a href="{% url 'contact' %}">Contact</a>


            </nav>


            <div class="nav-icons">


                <div class="search-container">


                        <button type="button"
                            class="nav-icon search-button"
                            title="Search"
                            aria-label="Search products">

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </button>


                    <form method="GET"
                          action="{% url 'product_list' %}"
                          class="header-search-form">


                        <input type="text"
                               name="search"
                               placeholder="Search dresses..."
                               autocomplete="off">


                        <button type="submit">

                            <i class="fa-solid fa-magnifying-glass"></i>

                        </button>


                    </form>


                </div>



                <!-- WISHLIST -->

                <a href="{% url 'wishlist' %}"
                   class="nav-icon"
                         title="Wishlist"
                         aria-label="Wishlist">

                    <i class="fa-regular fa-heart"></i>
                    <span class="nav-count" data-wishlist-count{% if not wishlist_count %} hidden{% endif %}>{{ wishlist_count }}</span>

                </a>



                <!-- CART -->

                     <a href="{% url 'cart' %}"
                   class="nav-icon"
                         data-cart-link
                                     title="Cart"
                                     aria-label="Cart">

                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="nav-count" data-cart-count{% if not cart_count %} hidden{% endif %}>{{ cart_count }}</span>

                </a>



                <a href="{% url 'order_list' %}"
                   class="nav-icon nav-orders-link"
                         title="My Orders"
                         aria-label="My Orders">
                    <i class="fa-solid fa-box" aria-hidden="true"></i>
                </a>


                <!-- LOGIN -->

                     <a href="{% if user.is_authenticated %}{% url 'profile' %}{% else %}{% url 'login' %}{% endif %}"
                     class="nav-icon nav-login-link"
                         title="{% if user.is_authenticated %}My account{% else %}Login{% endif %}"
                         aria-label="{% if user.is_authenticated %}My account{% else %}Login{% endif %}">

                          <i class="fa-regular fa-user" aria-hidden="true"></i>

                </a>


            </div>


        </div>

    </header>



    <!-- =========================
         PAGE CONTENT
    ========================= -->

    <div class="content">

        {% block content %}

        {% endblock %}

    </div>



    <!-- =========================
         FOOTER
    ========================= -->

    <footer>

        <p>
            © 2026 VASTRAM. All Rights Reserved.
        </p>

    </footer>





    <!-- =========================
         SEARCH JAVASCRIPT
    ========================= -->

    <script>

        const searchButton =
            document.querySelector('.search-button');

        const searchForm =
            document.querySelector('.header-search-form');


        searchButton.addEventListener('click', function () {


            if (searchForm.style.display === 'flex') {

                searchForm.style.display = 'none';

            }

            else {

                searchForm.style.display = 'flex';

                searchForm.querySelector('input').focus();

            }


        });

        const mobileMenuButton = document.querySelector('[data-mobile-menu-toggle]');
        const mainNavigation = document.querySelector('#navCenter');
        const categoryButton = document.querySelector('[data-category-toggle]');
        const categoryDropdown = categoryButton.closest('.dropdown');

        mobileMenuButton.addEventListener('click', function () {
            const isOpen = mobileMenuButton.getAttribute('aria-expanded') === 'true';
            mobileMenuButton.setAttribute('aria-expanded', String(!isOpen));
            mobileMenuButton.setAttribute('aria-label', isOpen ? 'Open navigation' : 'Close navigation');
            mobileMenuButton.innerHTML = isOpen
                ? '<i class="fa-solid fa-bars" aria-hidden="true"></i>'
                : '<i class="fa-solid fa-xmark" aria-hidden="true"></i>';
            mainNavigation.classList.toggle('is-open', !isOpen);
        });

        categoryButton.addEventListener('click', function () {
            const isOpen = categoryButton.getAttribute('aria-expanded') === 'true';
            categoryButton.setAttribute('aria-expanded', String(!isOpen));
            categoryDropdown.classList.toggle('open', !isOpen);
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                mainNavigation.classList.remove('is-open');
                categoryDropdown.classList.remove('open');
                mobileMenuButton.setAttribute('aria-expanded', 'false');
                mobileMenuButton.setAttribute('aria-label', 'Open navigation');
                mobileMenuButton.innerHTML = '<i class="fa-solid fa-bars" aria-hidden="true"></i>';
                categoryButton.setAttribute('aria-expanded', 'false');
            }
        });

    </script>


</body>

</html>
