{% extends 'base.html' %}

{% block title %}
Login - VASTRAM
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-heading">

            <p class="auth-brand">
                VASTRAM
            </p>

            <h1>VASTRAM LOGIN TEST</h1>

            <p>
                Sign in to continue shopping with us.
            </p>

        </div>


        <form action="" method="post">

            {% csrf_token %}


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                LOGIN
            </button>

        </form>


        <div class="register-link">

            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</div>


<style>

    .auth-page {
        min-height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        background-color: #fafafa;
    }


    .auth-box {
        width: 100%;
        max-width: 430px;
        background-color: white;
        padding: 45px;
        box-sizing: border-box;
        border: 1px solid #eeeeee;
    }


    .auth-heading {
        text-align: center;
        margin-bottom: 35px;
    }


    .auth-brand {
        font-size: 11px;
        letter-spacing: 3px;
        color: #888;
        margin-bottom: 12px;
    }


    .auth-heading h1 {
        font-size: 30px;
        font-weight: 500;
        margin: 0 0 10px;
        color: #222;
    }


    .auth-heading p:last-child {
        color: #777;
        font-size: 14px;
    }


    .form-group {
        margin-bottom: 22px;
    }


    .form-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 8px;
        color: #333;
    }


    .form-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: 1px solid #ddd;
        outline: none;
        font-size: 14px;
    }


    .form-group input:focus {
        border-color: #222;
    }


    .login-btn {
        width: 100%;
        padding: 14px;
        background-color: #222;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 12px;
        letter-spacing: 1.5px;
    }


    .login-btn:hover {
        background-color: #444;
    }


    .error-message {
        background-color: #f9eeee;
        color: #a33;
        padding: 12px;
        font-size: 13px;
        margin-bottom: 20px;
    }


    .register-link {
        text-align: center;
        margin-top: 25px;
        border-top: 1px solid #eeeeee;
        padding-top: 20px;
    }


    .register-link p {
        font-size: 13px;
        color: #777;
    }


    .register-link a {
        color: #222;
        font-weight: bold;
        text-decoration: none;
    }


    .register-link a:hover {
        text-decoration: underline;
    }

</style>

{% endblock %}
