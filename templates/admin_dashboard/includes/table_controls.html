<form method="get" class="admin-table-toolbar">
    <label class="visually-hidden" for="admin-table-search">Search records</label>
    <input id="admin-table-search" name="q" type="search" class="form-control form-control-sm" value="{{ table_search }}" placeholder="Search this table...">

    <label class="visually-hidden" for="admin-table-sort">Sort records by</label>
    <select id="admin-table-sort" name="sort" class="form-select form-select-sm">
        {% for sort_key, sort_label, sort_field in table_sort_options %}
            <option value="{{ sort_key }}" {% if table_sort == sort_key %}selected{% endif %}>{{ sort_label }}</option>
        {% endfor %}
    </select>

    <div class="admin-table-toolbar-options">
        {% if table_low_stock_filter %}
            <label class="admin-table-low-stock-filter" for="admin-table-low-stock">
                <input id="admin-table-low-stock" type="checkbox" name="low_stock" value="1" {% if table_extra_query_params.low_stock %}checked{% endif %}>
                Low stock only
            </label>
        {% endif %}
        <label class="visually-hidden" for="admin-table-direction">Sort direction</label>
        <select id="admin-table-direction" name="direction" class="form-select form-select-sm">
            <option value="asc" {% if table_direction == 'asc' %}selected{% endif %}>Ascending</option>
            <option value="desc" {% if table_direction == 'desc' %}selected{% endif %}>Descending</option>
        </select>
        <label class="visually-hidden" for="admin-table-page-size">Rows per page</label>
        <select id="admin-table-page-size" name="per_page" class="form-select form-select-sm">
            {% for page_size in table_page_sizes %}
                <option value="{{ page_size }}" {% if table_page_size == page_size %}selected{% endif %}>{{ page_size }} / page</option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-sm btn-primary">Apply</button>
        {% if table_search %}<a href="?" class="btn btn-sm btn-outline-secondary">Clear</a>{% endif %}
    </div>
</form>
