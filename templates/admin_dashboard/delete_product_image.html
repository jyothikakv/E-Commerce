{% extends 'admin_dashboard/admin_base.html' %}

{% block title %}Delete Product Image{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3>Delete Product Image</h3>

            <p class="mt-3">
                Are you sure you want to delete this image?
            </p>

            <p>
                <strong>Product:</strong>
                {{ image.product.name }}
            </p>

            {% if image.image %}

                <img src="{{ image.image.url }}"
                     class="img-thumbnail mb-3"
                     style="max-width: 300px;"
                     alt="{{ image.product.name }}">

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'product_images' image.product.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
