{% extends 'admin_dashboard/admin_base.html' %}

{% block title %}
Add Price
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2>Add Price</h2>
        <p class="text-muted">
            Record a new price for a product variant.
        </p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">

                    <button type="submit" class="btn btn-dark">
                        Save Price
                    </button>

                    <a href="{% url 'admin_price_history' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
