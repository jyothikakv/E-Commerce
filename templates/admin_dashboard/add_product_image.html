{% extends 'admin_dashboard/admin_base.html' %}

{% block title %}Add Product Image{% endblock %}

{% block content %}

<div class="container">

    <h2 class="mb-4">Add Product Image</h2>

    <p class="text-muted">
        Product: <strong>{{ product.name }}</strong>
    </p>

    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Select Image
                    </label>

                    <input type="file"
                           name="image"
                           class="form-control"
                           accept="image/*"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success">
                    Upload Image
                </button>

                <a href="{% url 'product_images' product.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
