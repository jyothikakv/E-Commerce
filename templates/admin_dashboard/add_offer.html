{% extends 'admin_dashboard/admin_base.html' %}

{% block title %}
Add Offer
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2>Add Offer</h2>

        <p class="text-muted">
            Create a temporary offer for a product variant.
        </p>
    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}


                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-dark">
                        Save Offer
                    </button>


                    <a
                        href="{% url 'admin_offers' %}"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
