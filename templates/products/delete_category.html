{% extends 'base.html' %}

{% block title %}
Delete Category
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-body">

            <h3 class="text-danger mb-3">
                Delete Category
            </h3>

            <p>
                Are you sure you want to delete
                <strong>{{ category.name }}</strong>?
            </p>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'category_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
